- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Installeer mariadb-server
  ansible.builtin.apt:
    name: mariadb-server
    state: present

- name: Zorg dat mariadb gestart en enabled is
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true