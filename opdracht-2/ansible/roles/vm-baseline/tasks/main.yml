---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade alle packages
  ansible.builtin.apt:
    upgrade: dist

- name: Voeg ESXi server toe aan /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ esxi_ip }} esxi"
    state: present
    create: true

- name: Voeg gebruiker test toe
  ansible.builtin.user:
    name: test
    state: present
    create_home: true
    shell: /bin/bash

- name: Kopieer lokaal bestand naar de VM
  ansible.builtin.copy:
    src: "{{ copied_file_src }}"
    dest: "{{ copied_file_dest }}"
    owner: iacuser
    group: root
    mode: "0644"

- name: Maak backup directory aan
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: iacuser
    group: root
    mode: "0755"

- name: Maak backup script aan
  ansible.builtin.copy:
    dest: "{{ backup_script_path }}"
    owner: iacuser
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      set -eu
      mkdir -p {{ backup_dir }}
      tar -czf {{ backup_dir }}/etc-backup-$(date +\%F).tar.gz /etc
      tar -czf {{ backup_dir }}/var-www-backup-$(date +\%F).tar.gz /var/www

- name: Voeg dagelijkse cronjob toe
  ansible.builtin.cron:
    name: "Dagelijkse backup van /etc en /var/www"
    minute: "{{ backup_minute }}"
    hour: "{{ backup_hour }}"
    job: "{{ backup_script_path }}"